[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "fedmedlora"
version = "0.1.0"
description = "Similarity-aware federated low-rank adaptation of vision foundation models across heterogeneous medical imaging modalities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "FedProtoLoRA Research Team"}
]
dependencies = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "timm>=0.9.0",
    "transformers>=4.30.0",
    "open_clip_torch>=2.20.0",
    "imagehash>=4.3.1",
    "Pillow>=9.5.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.2.0",
    "scipy>=1.10.0",
    "pyyaml>=6.0",
    "matplotlib>=3.7.0",
    "pytest>=7.3.0",
    "kagglehub>=0.2.0",
    "kaggle>=1.5.13"
]

[project.urls]
Repository = "https://github.com/tarequejosh/FedProtoLoRA"

[project.optional-dependencies]
dev = [
    "pytest>=7.3.0",
    "ruff>=0.3.0",
    "black>=24.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
